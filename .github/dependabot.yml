version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned exactly: pre-1.0 and breaks its API between minor versions.
      # Upgrades are done by hand together with the code changes they need.
      - dependency-name: nickel-lang-core
    groups:
      cargo:
        update-types: [minor, patch]
      # All security fixes in one pull request, since pull requests merge
      # one at a time. nickel-lang-core stays out, so a breaking bump cannot
      # block the other fixes.
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: [nickel-lang-core]

  # Workflows pin actions to commit SHAs. Dependabot replaces the SHA and the
  # version comment behind it when a new release tag appears.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Follows the stable branch, which has no version tags. Dependabot
      # could move the SHA to another branch, so it is refreshed by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
